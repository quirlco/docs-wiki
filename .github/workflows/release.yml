# BEFORE pushing any tag: the `npm` environment must already exist, with a
# required reviewer and a `v*` deployment-tag rule. If it does not, GitHub
# creates it on first use with no protection at all and the publish job would
# run unreviewed.
#
# Nothing here uses a long-lived npm token. Publishing authenticates with
# GitHub's OIDC identity (npm trusted publishing) and records provenance.
# The trusted publisher only allows *staging*: a release reaches users only
# after a maintainer approves the staged version on npm with 2FA.
# The job that runs dependency code (build) has no id-token; the job that
# holds id-token (publish) installs and runs nothing but npm itself.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      # No dependency cache anywhere in this workflow.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run
      - run: pnpm build
      - name: Tag, package.json and WIKI_VERSION agree
        run: |
          pkg="$(node -p "require('./package.json').version")"
          lib="$(node -e "import('./dist/index.js').then((m) => console.log(m.WIKI_VERSION))")"
          if [ "$GITHUB_REF_NAME" != "v$pkg" ] || [ "$pkg" != "$lib" ]; then
            echo "mismatch: tag $GITHUB_REF_NAME, package.json $pkg, WIKI_VERSION $lib" >&2
            exit 1
          fi
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi
      - name: Pack
        run: npm pack
      - name: List what will be published
        run: tar -tzf docs-wiki-*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: docs-wiki-*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance; only this job
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that can stage publishes
        run: npm install --global npm@12.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Stage for approval on npm
        run: npm stage publish ./docs-wiki-*.tgz --provenance --access public
